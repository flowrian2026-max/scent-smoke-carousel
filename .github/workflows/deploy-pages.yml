name: Build portable static preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build static site
        run: bun run build
      - name: Upload ready-to-host site
        uses: actions/upload-artifact@v4
        with:
          name: scent-smoke-carousel-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
