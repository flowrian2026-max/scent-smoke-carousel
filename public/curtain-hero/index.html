<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090e1c">
<title>SCENT SCRIBE — The Private Fragrance Gallery</title>
<style>
:root{--night:#080c18;--navy:#0a1123;--plum:#211a29;--silver:#d4dced;--silver-dim:#8d9ab5;--lav:#8589c8;--white:#f0f2f8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--white)}
body{font-family:Georgia,"Times New Roman",serif;overflow:hidden}
button{font:inherit}
.scene{height:100svh;min-height:620px;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 72%,#25243b 0%,#121a2b 36%,#080c18 77%)}
.backdrop{position:absolute;inset:0;z-index:0;overflow:hidden;background:
radial-gradient(ellipse at 15% 24%,rgba(102,120,166,.15),transparent 32%),
radial-gradient(ellipse at 85% 32%,rgba(112,84,135,.14),transparent 33%),
linear-gradient(110deg,#080d1b,#171a2d 48%,#090e1b)}
.backdrop:before,.backdrop:after{content:"";position:absolute;inset:-25%;pointer-events:none;filter:blur(34px);background:linear-gradient(112deg,transparent 37%,rgba(201,213,238,.08) 47%,transparent 56%);transform:translateX(-22%) rotate(-8deg);animation:lightSweep 17s ease-in-out infinite alternate}
.backdrop:after{transform:translateX(24%) rotate(9deg);opacity:.6;animation-delay:-8s}
@keyframes lightSweep{to{transform:translateX(27%) rotate(7deg)}}
.ambient-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:0;opacity:.62;mix-blend-mode:normal;filter:brightness(.58) saturate(.78) contrast(1.12)}
/* The rock-cliff footage is the only video layer. No smoke overlay. */
.halo{position:absolute;z-index:1;left:50%;top:55%;width:min(76vw,1000px);height:min(34vw,430px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(135,144,190,.13),transparent 67%);filter:blur(20px);pointer-events:none}
.topbar{position:absolute;z-index:6;top:0;left:0;right:0;padding:28px clamp(20px,5vw,76px);display:flex;align-items:center;justify-content:space-between;border-bottom:0}
.wordmark{font-size:17px;letter-spacing:.34em;color:#e6eaf4;white-space:nowrap}
.wordmark span{display:block;margin-top:6px;font:8px/1.3 Arial,sans-serif;letter-spacing:.45em;color:#8994b1}
.nav{display:flex;gap:30px;font:9px Arial,sans-serif;letter-spacing:.23em;color:#a7b0c6}
.nav a{color:inherit;text-decoration:none}
.top-index{font:9px Arial,sans-serif;letter-spacing:.2em;color:#98a2bd}
.hero-copy{position:absolute;z-index:2;top:18%;left:50%;transform:translateX(-50%);width:min(88%,800px);text-align:center;opacity:0;transition:opacity 1.2s .9s}
.scene.open .hero-copy{opacity:1}
.kicker{font:9px Arial,sans-serif;letter-spacing:.46em;color:#a7b3d0;text-transform:uppercase}
.hero-copy h1{font-size:clamp(37px,5.7vw,78px);font-weight:400;line-height:.98;letter-spacing:.095em;margin:17px 0 13px;text-shadow:0 6px 38px #03050b}
.hero-copy p{margin:0;font:10px Arial,sans-serif;letter-spacing:.27em;color:#a9b2c8}
.gallery{position:absolute;z-index:3;left:50%;top:63%;width:100%;height:clamp(270px,36vw,390px);perspective:1000px;perspective-origin:50% 30%;opacity:0;transform:translate(-50%,calc(-50% + 28px));transition:opacity 1.5s 1s,transform 1.65s 1s;overflow:visible;touch-action:pan-y;cursor:grab;}
.scene.open .gallery{opacity:1;transform:translate(-50%,-50%)}
.gallery.dragging{cursor:grabbing}
.gallery.dragging *{user-select:none}
.carousel-track{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(var(--rotation,0deg));will-change:transform}
.product{--radius:clamp(205px,30vw,385px);position:absolute;left:50%;top:50%;width:clamp(135px,17.5vw,210px);margin-left:clamp(-105px,-8.75vw,-67px);text-align:center;cursor:pointer;outline:none;transform-style:preserve-3d;transform:translateY(-50%) rotateY(calc(var(--i)*75deg)) translateZ(var(--radius)) rotateY(calc(-1 * (var(--i)*75deg + var(--rotation,0deg))));filter:none;backface-visibility:visible;transition:filter .35s}
.product:hover,.product:focus-visible{filter:none}
.bottle-wrap{height:clamp(165px,22vw,270px);display:flex;align-items:flex-end;justify-content:center;position:relative}
.bottle-photo{width:100%;height:100%;object-fit:contain;object-position:center bottom;overflow:visible;transform:scaleX(1.38);transform-origin:center bottom;filter:none;}
.orbit{display:none}
.plinth{position:relative;height:14px;width:100%;border-radius:50%;border:1px solid rgba(215,224,242,.64);background:linear-gradient(180deg,#667087 0%,#212a3d 37%,#080d1a 100%);box-shadow:none}
.plinth:before{content:"";position:absolute;left:8%;right:8%;top:-4px;height:4px;border-radius:50%;background:linear-gradient(90deg,transparent,#aab7d0 21%,#f0f3fa 49%,#8794ae 78%,transparent);box-shadow:none}
.plinth:after{content:none}
.product-name{margin-top:21px;font-size:11px;letter-spacing:.25em;color:#e4e9f4}
.product-sub{margin-top:7px;font:8px Arial,sans-serif;letter-spacing:.2em;color:#919db9}
.scene-rule{position:absolute;z-index:2;left:clamp(20px,5vw,76px);bottom:clamp(30px,5vh,58px);font:8px Arial,sans-serif;letter-spacing:.27em;color:#818da9;writing-mode:vertical-rl}
.curtains{position:absolute;inset:0;z-index:5;display:flex;pointer-events:none}
.panel{width:50%;height:82%;position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 87%,92% 91%,82% 88%,72% 94%,60% 90%,50% 96%,40% 91%,28% 94%,17% 89%,8% 92%,0 88%);transition:transform 3.45s cubic-bezier(.22,1,.36,1);will-change:transform}
.panel .velvet{border-radius:0;box-shadow:inset 0 0 95px 24px #02040b;}.panel.left{transform-origin:left center}.panel.right{transform-origin:right center}
.velvet{position:absolute;inset:-2% -3%;background:
radial-gradient(ellipse 13% 120% at 2% 50%,rgba(190,198,225,.34) 0%,rgba(122,127,164,.2) 34%,transparent 72%),
radial-gradient(ellipse 16% 120% at 15% 50%,rgba(0,0,0,.94) 0%,rgba(3,6,16,.72) 42%,transparent 76%),
radial-gradient(ellipse 13% 120% at 29% 50%,rgba(174,181,211,.3) 0%,rgba(105,111,150,.16) 38%,transparent 73%),
radial-gradient(ellipse 17% 120% at 44% 50%,rgba(0,0,0,.96) 0%,rgba(3,6,16,.74) 44%,transparent 78%),
radial-gradient(ellipse 13% 120% at 59% 50%,rgba(180,187,216,.32) 0%,rgba(112,119,157,.17) 38%,transparent 74%),
radial-gradient(ellipse 17% 120% at 74% 50%,rgba(0,0,0,.94) 0%,rgba(3,6,16,.7) 43%,transparent 77%),
radial-gradient(ellipse 13% 120% at 89% 50%,rgba(177,184,214,.28) 0%,rgba(106,113,152,.15) 39%,transparent 74%),
linear-gradient(90deg,#070a17 0%,#171729 48%,#080d1b 100%);
box-shadow:inset 0 0 95px 24px #02040b,0 0 34px #02040b}
.velvet:before{content:"";position:absolute;inset:-2% -5%;pointer-events:none;background:
repeating-linear-gradient(90deg,transparent 0 7%,rgba(0,0,0,.22) 9%,rgba(198,203,226,.18) 11%,rgba(0,0,0,.18) 13%,transparent 16%);
filter:blur(7px);opacity:.85;transform:scaleX(1.08) skewY(-.7deg)}
.velvet:after{content:"";position:absolute;inset:0;pointer-events:none;background:
linear-gradient(90deg,rgba(0,0,0,.48),transparent 10%,rgba(0,0,0,.16) 48%,transparent 88%,rgba(0,0,0,.42)),
linear-gradient(180deg,rgba(0,0,0,.34),transparent 20%,transparent 82%,rgba(0,0,0,.4))}
.panel.left .velvet{border-right:1px solid rgba(202,213,237,.22)}
.panel.right .velvet{border-left:1px solid rgba(202,213,237,.22)}
.panel:after{content:"";position:absolute;top:0;bottom:0;width:1px;opacity:.48;background:linear-gradient(transparent,rgba(205,216,237,.7),transparent)}
.panel.left:after{right:10%}.panel.right:after{left:10%}
.scene.open .panel.left{transform:translateX(-101%)}
.scene.open .panel.right{transform:translateX(101%)}
.seam{position:absolute;z-index:6;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(transparent,rgba(210,222,244,.52),transparent);transition:opacity .4s}
.scene.open .seam{opacity:0}
.detail{position:absolute;z-index:8;right:clamp(16px,4vw,56px);bottom:clamp(22px,5vh,52px);width:min(310px,calc(100vw - 32px));padding:20px 22px 19px;background:linear-gradient(135deg,rgba(26,34,54,.85),rgba(10,15,29,.84));border:1px solid rgba(199,211,234,.3);backdrop-filter:blur(20px);box-shadow:0 18px 60px rgba(0,0,0,.45);opacity:0;transform:translateY(14px);pointer-events:none;transition:.45s}
.detail.visible{opacity:1;transform:none;pointer-events:auto}
.detail-close{position:absolute;top:8px;left:12px;border:0;background:none;color:#c8d0e2;font-size:20px;cursor:pointer}
.detail .micro{font:8px Arial,sans-serif;letter-spacing:.33em;color:#9eabc9}
.detail h2{font-size:22px;font-weight:400;letter-spacing:.1em;margin:10px 0}
.detail p{font:11px/1.75 Arial,sans-serif;color:#b7c0d4;margin:0}
.detail a{display:inline-block;margin-top:13px;color:#d8dfed;text-decoration:none;font:8px Arial,sans-serif;letter-spacing:.22em;border-bottom:1px solid rgba(216,223,237,.45);padding-bottom:5px}
.controls{position:absolute;z-index:7;left:50%;bottom:21px;transform:translateX(-50%);display:flex;gap:9px;white-space:nowrap}
.controls button{padding:9px 15px;border-radius:40px;border:1px solid rgba(196,209,234,.32);background:rgba(8,13,25,.56);color:#d5ddec;font:8px Arial,sans-serif;letter-spacing:.2em;backdrop-filter:blur(12px);cursor:pointer;transition:background .25s,border-color .25s}
.controls button:hover{background:rgba(128,137,194,.17);border-color:rgba(210,221,241,.6)}
.start-note{position:absolute;z-index:6;bottom:76px;left:50%;transform:translateX(-50%);font:8px Arial,sans-serif;letter-spacing:.35em;color:#a6b0c6;white-space:nowrap;transition:opacity .4s}
.scene.open .start-note{opacity:0}
.grain{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E")}
@media(max-width:680px){
 body{overflow:hidden}.scene{min-height:560px}
 .topbar{padding:19px 17px}.wordmark{font-size:13px;letter-spacing:.28em}.nav{display:none}.top-index{font-size:8px}
 .hero-copy{top:16%;width:94%}.hero-copy h1{font-size:clamp(32px,9vw,46px);letter-spacing:.06em;margin:14px 0}.hero-copy p{font-size:8px;letter-spacing:.15em;line-height:1.7}
 .gallery{top:62%;height:260px;perspective:720px;perspective-origin:50% 32%}
 .product{--radius:clamp(150px,41vw,210px);width:31vw;margin-left:-15.5vw}
 .bottle-wrap{height:clamp(145px,28vh,190px)}.bottle-photo{transform:scaleX(1.3)}.plinth{height:11px}.plinth:after{top:9px;height:20px}
 .scene-rule{display:none}.detail{right:12px;bottom:58px;width:calc(100vw - 24px);padding:17px 18px}.detail h2{font-size:19px}
 .controls{bottom:12px}.controls button{padding:8px 11px;font-size:7px}.start-note{bottom:57px;font-size:7px;letter-spacing:.18em}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Bottle-shatter entrance and liquid-to-smoke handoff */
.intro-layer{position:fixed;inset:0;z-index:30;background:#05030e;opacity:1;visibility:visible;transition:opacity 1.7s ease,visibility 1.7s;overflow:hidden}
.intro-layer.done{opacity:0;visibility:hidden;pointer-events:none}
.intro-layer video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#05030e}
.intro-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 48%,rgba(4,3,12,.62) 100%);pointer-events:none}
.intro-hint{position:absolute;left:0;right:0;bottom:8vh;text-align:center;color:#f1eafa;letter-spacing:.34em;font:11px/1.5 Arial,sans-serif;text-shadow:0 0 18px #9c83c9;transition:opacity .5s}
.intro-dots{display:flex;justify-content:center;gap:12px;margin-top:16px}
.intro-dots i{width:7px;height:7px;border:1px solid #d8c9f4;border-radius:50%;transition:background .25s,box-shadow .25s}
.intro-dots i.hit{background:#c9b4ef;box-shadow:0 0 12px #b89be9}
.intro-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.intro-layer.hit-flash .intro-flash{animation:introFlash .42s ease-out}
@keyframes introFlash{0%{opacity:.3}100%{opacity:0}}
.intro-layer.shake video{animation:introShake .28s linear}
@keyframes introShake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
.liquid-smoke{position:absolute;inset:-18%;opacity:0;pointer-events:none;filter:blur(34px);transform:scale(.72);transition:opacity 1.1s ease,transform 2.8s cubic-bezier(.2,.7,.1,1);background:
radial-gradient(ellipse at 18% 56%,rgba(123,83,190,.78),transparent 31%),
radial-gradient(ellipse at 78% 42%,rgba(73,132,190,.65),transparent 29%),
radial-gradient(ellipse at 52% 78%,rgba(174,91,155,.58),transparent 32%),
radial-gradient(ellipse at 48% 28%,rgba(116,101,177,.45),transparent 34%)}
.liquid-smoke.rising{opacity:.94;transform:scale(1.12);animation:smokeDrift 4.2s ease-in-out forwards}
@keyframes smokeDrift{0%{filter:blur(34px);transform:scale(.72) translateY(8%)}45%{filter:blur(48px);transform:scale(1.18) translateY(-2%)}100%{filter:blur(60px);transform:scale(1.45) translateY(-12%);opacity:.72}}
@media(prefers-reduced-motion:reduce){.liquid-smoke.rising{animation:none;transform:scale(1.1)}}

</style>
</head>
<body>
<main class="scene" id="scene">
  <div class="backdrop" aria-hidden="true"></div>
  <video class="ambient-video" id="ambientVideo" src="https://raw.githubusercontent.com/flowrian2026-max/Midnight-file-test/main/Ariooo/sakhre%20poshte%20hero.mp4" muted autoplay loop playsinline preload="auto"></video>
  <div class="halo" aria-hidden="true"></div>


  <div class="intro-layer" id="bottleIntro" aria-label="Tap to shatter the perfume bottle">
    <video id="bottleVideo" src="https://raw.githubusercontent.com/flowrian2026-max/Midnight-file-test/main/Entrance.mp4" muted playsinline preload="auto"></video>
    <div class="intro-vignette"></div><div class="liquid-smoke" id="liquidSmoke"></div><div class="intro-flash"></div>
    <div class="intro-hint" id="introHint">TAP THE BOTTLE<div class="intro-dots" id="introDots"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>

  <header class="topbar">
    <div class="wordmark">SCENT SCRIBE<span>THE PRIVATE FRAGRANCE GALLERY</span></div>
    <nav class="nav"><a href="#gallery">COLLECTION</a><a href="#gallery">THE ATELIER</a><a href="#gallery">DISCOVER</a></nav>
    <div class="top-index">EXHIBITION 01 / 05</div>
  </header>

  <!-- Hero headline temporarily hidden -->

  <div class="scene-rule">SCENT · FORM · ATMOSPHERE</div>

  <section class="gallery" id="gallery" aria-label="Rotating five-fragrance collection">
    <div class="carousel-track">
      <article class="product" style="--i:0" tabindex="0" role="button" aria-label="Discover Nocturne"
        data-name="NOCTURNE" data-notes="BLACK IRIS · SMOKED CEDAR · MUSK"
        data-description="A deep, architectural composition with a quiet and magnetic trail.">
        <div class="bottle-wrap"><img class="bottle-photo" src="https://raw.githubusercontent.com/flowrian2026-max/scent-smoke-carousel/main/src/assets/bottle-violet.png" alt="Violet perfume bottle" loading="eager" draggable="false"><div class="orbit"></div></div>
        <div class="plinth"></div>
      </article>
      <article class="product" style="--i:1" tabindex="0" role="button" aria-label="Discover Velvet Haze"
        data-name="VELVET HAZE" data-notes="DARK ROSE · VIOLET · CASHMERE WOOD"
        data-description="A soft floral heart wrapped in an elegant, cool and velvety finish.">
        <div class="bottle-wrap"><img class="bottle-photo" src="https://raw.githubusercontent.com/flowrian2026-max/scent-smoke-carousel/main/src/assets/bottle-rose.png" alt="Rose perfume bottle" loading="eager" draggable="false"><div class="orbit"></div></div>
        <div class="plinth"></div>
      </article>
      <article class="product" style="--i:2" tabindex="0" role="button" aria-label="Discover Afterlight"
        data-name="AFTERLIGHT" data-notes="BERGAMOT · MINERAL AIR · PALE CEDAR"
        data-description="A bright mineral opening balanced by a refined, transparent woody base.">
        <div class="bottle-wrap"><img class="bottle-photo" src="https://raw.githubusercontent.com/flowrian2026-max/scent-smoke-carousel/main/src/assets/bottle-blue.png" alt="Blue perfume bottle" loading="eager" draggable="false"><div class="orbit"></div></div>
        <div class="plinth"></div>
      </article>
      <article class="product" style="--i:3" tabindex="0" role="button" aria-label="Discover Amber Veil"
        data-name="AMBER VEIL" data-notes="GOLDEN AMBER · VANILLA · SOFT OUD"
        data-description="Warm amber and smooth vanilla settle into a refined, softly glowing trail.">
        <div class="bottle-wrap"><img class="bottle-photo" src="https://raw.githubusercontent.com/flowrian2026-max/scent-smoke-carousel/main/src/assets/bottle-amber.png" alt="Amber perfume bottle" loading="eager" draggable="false"><div class="orbit"></div></div>
        <div class="plinth"></div>
      </article>
      <article class="product" style="--i:4" tabindex="0" role="button" aria-label="Discover Silver Noire"
        data-name="SILVER NOIRE" data-notes="WHITE MUSK · IRIS · COLD WOODS"
        data-description="A cool, luminous fragrance with a clean musk heart and a polished woody finish.">
        <div class="bottle-wrap"><img class="bottle-photo" style="filter:hue-rotate(145deg) saturate(.78)" src="https://raw.githubusercontent.com/flowrian2026-max/scent-smoke-carousel/main/src/assets/bottle-violet.png" alt="Cool-toned perfume bottle" loading="eager" draggable="false"><div class="orbit"></div></div>
        <div class="plinth"></div>
      </article>
    </div>
  </section>

  <div class="start-note">THE FRAGRANCE GALLERY IS ABOUT TO OPEN</div>
  <div class="curtains" aria-hidden="true"><div class="panel left"><div class="velvet"></div></div><div class="panel right"><div class="velvet"></div></div></div>
  <div class="seam" aria-hidden="true"></div>

  <aside class="detail" id="detail" aria-live="polite">
    <button class="detail-close" id="detailClose" aria-label="Close product details">×</button>
    <div class="micro">FRAGRANCE PROFILE</div>
    <h2 id="detailName">NOCTURNE</h2>
    <p id="detailNotes"></p>
    <p id="detailDescription" style="margin-top:8px"></p>
    <a href="#gallery" id="detailLink">EXPLORE FRAGRANCE ↗</a>
  </aside>

  <div class="controls">
    <button id="replay">REPLAY CURTAIN</button>
    <button id="skip">ENTER GALLERY</button>
  </div>
  <div class="grain" aria-hidden="true"></div>
</main>
<script>
(() => {
  const scene = document.getElementById('scene');
  const detail = document.getElementById('detail');
  let revealTimer;
  // The gallery stays behind the velvet until the bottle intro completes.
  function replay() {
    window.clearTimeout(revealTimer);
    detail.classList.remove('visible');
    scene.classList.remove('open');
    revealTimer = window.setTimeout(() => scene.classList.add('open'), 500);
  }
  function enter() {
    window.clearTimeout(revealTimer);
    scene.classList.add('open');
  }
  const intro = document.getElementById('bottleIntro');
  const bottleVideo = document.getElementById('bottleVideo');
  const introHint = document.getElementById('introHint');
  const smoke = document.getElementById('liquidSmoke');
  const dots = [...document.querySelectorAll('#introDots i')];
  const hitStops = [2.0, 2.75, 3.5, 4.4];
  let hits = 0, introReady = false, introMode = 'loading', handoffStarted = false;
  bottleVideo.addEventListener('canplay', () => {
    if (introReady) return;
    introReady = true; introMode = 'idle';
    bottleVideo.currentTime = 0;
    bottleVideo.play().catch(() => {});
  }, {once:true});
  bottleVideo.addEventListener('error', () => {
    // If the legacy clip cannot load, keep the gallery reachable through a gentle smoke reveal.
    introHint.textContent = 'TAP TO ENTER THE GALLERY';
    introReady = true; introMode = 'fallback';
  });
  function finishBottleIntro() {
    if (handoffStarted) return;
    handoffStarted = true;
    introHint.style.opacity = '0';
    smoke.classList.add('rising');
    window.setTimeout(() => {
      scene.classList.add('open');
      intro.classList.add('done');
    }, 1150);
    window.setTimeout(() => intro.remove(), 3200);
  }
  function hitBottle() {
    if (!introReady || handoffStarted || hits >= 5) return;
    hits++;
    dots.forEach((dot, index) => dot.classList.toggle('hit', index < hits));
    intro.classList.remove('shake','hit-flash'); void intro.offsetWidth;
    intro.classList.add('shake','hit-flash');
    // Keep the live bottle/water loop moving between impacts; never freeze on taps.
    if (hits < 5) {
      introMode = 'idle';
      if (bottleVideo.paused) bottleVideo.play().catch(() => {});
      introHint.firstChild.textContent = 'TAP THE BOTTLE';
      return;
    }
    // The fifth impact releases the continuous shatter/reveal part of the original clip.
    introHint.firstChild.textContent = 'THE SCENT IS REVEALED';
    introHint.style.opacity = '0';
    introMode = 'shatter';
    bottleVideo.loop = false;
    bottleVideo.currentTime = 4.4;
    bottleVideo.playbackRate = 1;
    bottleVideo.play().catch(() => {});
    window.setTimeout(() => smoke.classList.add('rising'), 1500);
  }
  bottleVideo.addEventListener('timeupdate', () => {
    if (introMode === 'idle' && bottleVideo.currentTime >= 1.25) {
      bottleVideo.currentTime = 0;
      if (bottleVideo.paused) bottleVideo.play().catch(() => {});
    } else if (introMode === 'shatter' && bottleVideo.currentTime >= 9.85) {
      finishBottleIntro();
    }
  });
  intro.addEventListener('pointerdown', event => { event.preventDefault(); hitBottle(); });
  document.addEventListener('keydown', event => {
    if (!handoffStarted && (event.code === 'Space' || event.code === 'Enter')) {
      if (event.target.closest('button,a,input,textarea')) return;
      event.preventDefault(); hitBottle();
    }
  });

  document.getElementById('replay').addEventListener('click', replay);
  document.getElementById('skip').addEventListener('click', enter);
  const items = document.querySelectorAll('.product');
  items.forEach(item => {
    const show = () => {
      document.getElementById('detailName').textContent = item.dataset.name;
      document.getElementById('detailNotes').textContent = item.dataset.notes;
      document.getElementById('detailDescription').textContent = item.dataset.description;
      detail.classList.add('visible');
    };
    item.addEventListener('click', show);
    item.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); show(); }
    });
  });
  document.getElementById('detailClose').addEventListener('click', () => detail.classList.remove('visible'));

  // Five-product carousel: swipe/drag on phones and mouse-wheel/trackpad on desktop.
  const gallery = document.querySelector('.gallery');
  const track = document.querySelector('.carousel-track');
  let rotation = 0;
  let activePointer = null;
  let lastPointerX = 0;
  let pointerStartX = 0;
  let didDrag = false;
  let suppressClickUntil = 0;
  const applyRotation = value => {
    rotation = value;
    track.style.setProperty('--rotation', rotation + 'deg');
  };

  gallery.addEventListener('wheel', event => {
    if (!scene.classList.contains('open')) return;
    event.preventDefault();
    const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
    applyRotation(rotation - delta * 0.38);
  }, { passive: false });

  gallery.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    activePointer = event.pointerId;
    lastPointerX = pointerStartX = event.clientX;
    didDrag = false;
    gallery.setPointerCapture(event.pointerId);
  });

  gallery.addEventListener('pointermove', event => {
    if (event.pointerId !== activePointer) return;
    const dx = event.clientX - lastPointerX;
    if (!didDrag && Math.abs(event.clientX - pointerStartX) > 6) {
      didDrag = true;
      gallery.classList.add('dragging');
    }
    if (didDrag) applyRotation(rotation + dx * 0.52);
    lastPointerX = event.clientX;
  });

  const finishPointer = event => {
    if (event.pointerId !== activePointer) return;
    if (didDrag) suppressClickUntil = Date.now() + 350;
    activePointer = null;
    gallery.classList.remove('dragging');
  };
  gallery.addEventListener('pointerup', finishPointer);
  gallery.addEventListener('pointercancel', finishPointer);
  gallery.addEventListener('click', event => {
    if (Date.now() < suppressClickUntil) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);

  document.addEventListener('keydown', event => {
    if (!scene.classList.contains('open')) return;
    if (event.target.closest('input, textarea, select, button, a, [contenteditable="true"]')) return;
    if (event.key === 'ArrowRight') { event.preventDefault(); applyRotation(rotation + 18); }
    if (event.key === 'ArrowLeft') { event.preventDefault(); applyRotation(rotation - 18); }
  });
  // Start with the bottle interaction; curtain reveal is triggered by the smoke handoff.
})();
</script>
<!-- Curtain hero preview build trigger -->
